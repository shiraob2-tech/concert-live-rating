<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19264b"><link rel="manifest" href="manifest.webmanifest"><title>コンサート・ライブ評価ノート</title><style>body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;color:#172033}header{background:#19264b;color:white;padding:22px}main{max-width:720px;margin:auto;padding:14px}.panel{background:white;border-radius:14px;padding:18px;margin-bottom:14px}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #cbd5e1;border-radius:8px}label{display:block;font-size:14px}button{background:#2458bd;color:white;border:0;padding:11px 15px;border-radius:9px;margin:4px;cursor:pointer}.secondary{background:#e2e8f0;color:#172033}.event{border-top:1px solid #ddd;padding:12px 0}.muted{color:#64748b;font-size:13px}.stars{color:#b45309}</style></head><body><header><h2>🎵 コンサート・ライブ評価ノート</h2><div>Googleカレンダーから公演を取り込み、評価を保存</div></header><main><section class="panel"><h3>Googleカレンダー接続</h3><label>OAuth クライアントID<input id="client" placeholder="xxxxx.apps.googleusercontent.com"></label><button id="saveClient">ID保存</button><button id="login">Googleに接続</button><button id="sync">同期する</button><p class="muted">「コンサート」「ライブ」が予定タイトルに含まれるものだけを抽出します。接続にはGoogle CloudのOAuth設定が必要です。</p><p id="status" role="status">未接続</p></section><section class="panel"><h3>公演一覧</h3><button class="secondary" id="add">＋手動追加</button><div id="list"></div></section><section class="panel"><h3>評価を記録</h3><form id="form"><input id="recordId" type="hidden"><label>公演名<input id="title" required></label><label>開催日<input id="date" type="date"></label><label>会場<input id="venue"></label><label>出演者<input id="artist"></label><label>演奏・歌唱（1〜5）<input id="music" type="number" min="1" max="5" value="5" required></label><label>音響（1〜5）<input id="sound" type="number" min="1" max="5" value="5" required></label><label>演出（1〜5）<input id="stage" type="number" min="1" max="5" value="5" required></label><label>総合満足度（1〜5）<input id="overall" type="number" min="1" max="5" value="5" required></label><label>感想<textarea id="memo" rows="4"></textarea></label><button type="submit">保存</button><button class="secondary" type="button" id="clear">クリア</button></form></section><p class="muted">評価データはこのブラウザに保存されます。ブラウザデータを削除すると消える可能性があります。</p></main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="app.js"></script></body></html>
